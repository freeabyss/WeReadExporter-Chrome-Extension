<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>微信读书导出助手</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      width: 320px; margin: 0; padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 13px; line-height: 1.6; color: #1f2328; background: #fff;
    }
    header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .logo {
      width: 34px; height: 34px; border-radius: 9px;
      display: grid; place-items: center; font-size: 17px;
      background: linear-gradient(135deg, #4c84ff, #2f6bff);
      color: #fff;
    }
    h1 { font-size: 14px; margin: 0; }
    .version { color: #6b7280; font-size: 11px; }
    ol { margin: 8px 0 12px; padding-left: 18px; color: #374151; }
    li { margin-bottom: 4px; }
    button {
      width: 100%; padding: 8px 10px; border: none; border-radius: 9px;
      background: #2f6bff; color: #fff; font: inherit; font-weight: 600; cursor: pointer;
    }
    button:hover { filter: brightness(1.05); }
    .hint { color: #6b7280; font-size: 11px; margin: 8px 0 0; }
    .renew { background: #fff; color: #b91c1c; border: 1px solid #fca5a5; font-weight: 500; margin-top: 6px; }
    @media (prefers-color-scheme: dark) {
      body { background: #1b1f27; color: #e6edf3; }
      ol { color: #c9d1d9; }
      .hint, .version { color: #9aa4b2; }
      .renew { background: transparent; color: #ff9b9b; border-color: #7f1d1d; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">📚</div>
    <div>
      <h1>微信读书导出助手</h1>
      <div class="version">v<span id="version">1.1.0</span> · 全文导出</div>
    </div>
  </header>

  <ol>
    <li>在微信读书网页版打开任意一本书。</li>
    <li>点击右下角 <b>「导出」</b> 悬浮按钮。</li>
    <li>选择格式后点 <b>「导出全文」</b>，等待进度完成。</li>
    <li>文件会自动下载，也可在面板里再次保存或复制。</li>
  </ol>

  <button id="open-reader">打开微信读书</button>
  <button id="reload" class="renew">当前页面没看到按钮？刷新阅读页</button>

  <p class="hint">
    若大量章节提示「无法获取正文」，通常是账号未购买/未开通会员，或登录状态过期：
    刷新页面重新登录后再试。已成功导出的章节会自动缓存，重试时不会重复抓取。
  </p>

  <script src="popup.js"></script>
</body>
</html>
